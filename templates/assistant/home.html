
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MailMate - AI Email Assistant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
            min-height: 100vh;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 22px 40px;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            max-width: 750px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            outline: none;
        }

        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result-box {
            margin-top: 30px;
            padding: 22px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
        }

        .result-box h2 {
            color: #15803d;
            margin-bottom: 15px;
        }

        .result {
            color: #333;
            line-height: 1.8;
            overflow-wrap: break-word;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px 15px;
                padding: 22px;
            }

            header {
                padding: 18px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        MailMate ✉
    </header>

    <div class="container">

        <h1>AI Email Assistant</h1>

        <p class="subtitle">
            Generate professional emails instantly with AI.
        </p>

        <form method="POST">
            {% csrf_token %}

            <label>Select Email Type</label>

            <select name="email_type">
                <option>Professional Email</option>
                <option>Leave Request</option>
                <option>Job Application</option>
                <option>Meeting Request</option>
                <option>College Email</option>
            </select>

            <label>Describe Your Email</label>

            <textarea
                name="prompt"
                placeholder="Example: Request leave from college for two days..."
                required
            ></textarea>

            <button type="submit">
                Generate Email ✨
            </button>

        </form>

        {% if result %}
            <div class="result-box">
                <h2>Generated Email</h2>

                <div class="result">
                    {{ result|linebreaksbr }}
                </div>
            </div>
        {% endif %}

    </div>

    <footer>
        © 2026 MailMate | AI-Powered Email Assistant
    </footer>

</body>
</html>
